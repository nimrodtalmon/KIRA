<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#f6f1e7" />
  <title>פיד שירה · Poetry Feed</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loading" class="overlay-center">
    <div class="spinner"></div>
    <p>טוען שירה…</p>
  </div>

  <header id="topbar" hidden>
    <button id="open-liked" class="icon-btn" aria-label="אהבתי" title="אהבתי">♥</button>
    <button id="open-settings" class="icon-btn" aria-label="הגדרות" title="הגדרות">☰</button>
  </header>

  <main id="stage" hidden>
    <div id="stack" aria-live="polite"></div>
    <div id="hint">החליקו ימינה אם אהבתם · שמאלה אם לא</div>
    <div id="controls">
      <button id="btn-nope" class="ctrl nope" aria-label="לא אהבתי">✕</button>
      <button id="btn-undo" class="ctrl undo" aria-label="ביטול" disabled>↺</button>
      <button id="btn-like" class="ctrl like" aria-label="אהבתי">♥</button>
    </div>
  </main>

  <!-- Settings -->
  <div id="settings-panel" class="panel" hidden>
    <div class="panel-inner">
      <button class="panel-close" data-close aria-label="סגירה">✕</button>
      <h2>הגדרות</h2>

      <label class="switch-row">
        <span>ניקוד</span>
        <input type="checkbox" id="nikkud-toggle" />
        <span class="switch"></span>
      </label>

      <div class="seg-block">
        <span class="seg-label">סינון</span>
        <div class="segment" id="filter-segment">
          <button data-filter="all" class="seg-btn">הכול</button>
          <button data-filter="original" class="seg-btn">מקור עברי</button>
          <button data-filter="translated" class="seg-btn">מתורגם</button>
        </div>
      </div>

      <div class="learn-block">
        <h3>מה למדתי עליך</h3>
        <p id="learned" class="learned"></p>
        <button id="reset-learning" class="text-btn">איפוס הלמידה</button>
      </div>

      <div class="about">
        <h3>על האפליקציה</h3>
        <p>פיד שקט של שירה עברית ושירה מתורגמת לעברית — נחלת הכלל. ההמלצות נלמדות
          אצלכם במכשיר, ללא שרת. כל השירים מתוך מיזם בן-יהודה.</p>
        <a href="https://benyehuda.org" target="_blank" rel="noopener">benyehuda.org ↗</a>
        <p class="count" id="corpus-count"></p>
      </div>
    </div>
  </div>

  <!-- Liked -->
  <div id="liked-panel" class="panel" hidden>
    <div class="panel-inner">
      <button class="panel-close" data-close aria-label="סגירה">✕</button>
      <h2>אהבתי</h2>
      <ul id="liked-list"></ul>
      <p id="liked-empty" class="empty">עוד לא אהבת שירים. החליקו ימינה על שיר שאהבתם.</p>
    </div>
  </div>

  <!-- Reader -->
  <div id="reader" class="panel" hidden>
    <div class="panel-inner reader-inner">
      <button class="panel-close" data-close aria-label="סגירה">✕</button>
      <div id="reader-body"></div>
    </div>
  </div>

  <script src="recommender.js"></script>
  <script src="app.js"></script>
</body>
</html>
